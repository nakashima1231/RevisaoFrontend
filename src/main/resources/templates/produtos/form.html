<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Formulário de Produto</title>
</head>
<body>
<div th:replace="~{fragments/layout :: cabecalho}"></div>

<h1 th:text="${produto.id != null} ? 'Editar Produto' : 'Cadastrar Produto'"></h1>

<!-- 1. Adicionado enctype="multipart/form-data" -->
<form th:action="@{/produtos/salvar}" th:object="${produto}" method="post" enctype="multipart/form-data">
    <input type="hidden" th:field="*{id}" />

    <p>
        <label for="categoria">Categoria:</label><br>
        <select id="categoria" name="categoria.id" required>
            <option th:each="cat : ${categorias}"
                    th:value="${cat.id()}"
                    th:text="${cat.nome()}"
                    th:selected="${(produto.categoria() != null and produto.categoria().id() == cat.id())
                                   or (produto.nomeCategoria() != null and produto.nomeCategoria() == cat.nome())}">
            </option>
        </select>
    </p>

    <p>
        <label for="nome">Nome:</label><br>
        <input type="text" id="nome" th:field="*{nome}" required />
    </p>

    <p>
        <label for="preco">Preço:</label><br>
        <input type="number" step="0.01" id="preco" th:field="*{preco}" required />
    </p>

    <!-- 2. Novo campo para o Upload da Foto -->
    <p>
        <label for="fotoFile">Foto do Produto:</label><br>
        <input type="file" id="fotoFile" name="fotoFile" accept="image/*" />
    </p>

    <!-- 3. Novo campo para o Upload do Documento/Manual (PDF) -->
    <p>
        <label for="manualFile">Manual / Documento (PDF):</label><br>
        <input type="file" id="manualFile" name="manualFile" accept="application/pdf" />
    </p>

    <p>
        <button type="submit">Salvar</button>
        <a th:href="@{/produtos}">Cancelar</a>
    </p>
</form>
</body>
</html>

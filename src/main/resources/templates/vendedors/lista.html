<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Lista de Produtos</title>
</head>
<body>
<div th:replace="~{fragments/layout :: cabecalho}"></div>

<h1>Produtos</h1>
<p>
    <a th:href="@{/produtos/novo}">Cadastrar Produto</a>
</p>
<table border="1" cellpadding="8">
    <thead>
    <tr>
        <th>Foto</th>
        <th>Nome</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="prod : ${produtos}">
        <td>
            <img th:src="@{${apiBaseUrl} + ${prod.foto()}}" alt="Foto do Produto" width="30" />
        </td>
        <td th:text="${prod.nome()}"></td>
        <td>
            <a th:href="@{/produtos/editar/{id}(id=${prod.id()})}">Editar</a>
            <a th:href="@{/produtos/excluir/{id}(id=${prod.id()})}">Excluir</a>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>

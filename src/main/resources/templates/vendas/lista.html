<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Lista de vendas</title>
</head>
<body>
<div th:replace="~{fragments/layout :: cabecalho}"></div>

<h1>vendas</h1>
<p>
    <a th:href="@{/vendas/novo}">Cadastrar venda</a>
</p>
<table border="1" cellpadding="8">
    <thead>
    <tr>
        <th>Data</th>
        <th>Valor</th>
        <th>Cliente</th>
        <th>Vendedor</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="venda : ${vendas}">
        <td th:text="${venda.data()}"></td>
        <td th:text="${#numbers.formatCurrency(venda.valor())}"></td>
        <td th:text="${venda.cliente().nome}"></td>
        <td th:text="${venda.vendedor().nome}"></td>

        <td>
            <a th:href="@{/vendas/editar/{id}(id=${venda.id()})}">Editar</a>
            <a th:href="@{/vendas/excluir/{id}(id=${venda.id()})}">Excluir</a>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Lista de Categorias</title>
</head>
<body>
    <div th:replace="~{fragments/layout :: cabecalho}"></div>

    <h1>Categorias</h1>
    <p>
        <a th:href="@{/categorias/novo}">Adicionar</a>
    </p>
    <table border="1" cellpadding="8">
        <thead>
        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="prod : ${categorias}">
            <td th:text="${prod.id()}"></td>
            <td th:text="${prod.nome()}"></td>
            <td>
                <a th:href="@{/categorias/editar/{id}(id=${prod.id()})}">Editar</a>
                <a th:href="@{/categorias/excluir/{id}(id=${prod.id()})}">Excluir</a>
            </td>
        </tr>
        </tbody>
    </table>
</body>
</html>

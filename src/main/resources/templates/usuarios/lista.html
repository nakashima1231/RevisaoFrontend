<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Lista de Usuarios</title>
</head>
<body>
    <div th:replace="~{fragments/layout :: cabecalho}"></div>

    <h1>Usuarios</h1>
    <p>
        <a th:href="@{/usuarios/novo}">Cadastrar Usuario</a>
    </p>
    <table border="1" cellpadding="8">
        <thead>
        <tr>
            <th>ID</th>
            <th>Username</th>
            <th>Role</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="prod : ${usuarios}">
            <td th:text="${prod.id()}"></td>
            <td th:text="${prod.username()}"></td>
            <td th:text="${prod.role()}"></td>
            <td>
                <a th:href="@{/usuarios/editar/{id}(id=${prod.id()})}">Editar</a>
                <a th:href="@{/usuarios/excluir/{id}(id=${prod.id()})}">Excluir</a>
            </td>
        </tr>
        </tbody>
    </table>
</body>
</html>
